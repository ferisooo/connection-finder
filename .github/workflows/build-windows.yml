name: Build Windows app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      # Needed to publish the download on the Releases page.
      contents: write
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Download packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Run tests (includes a real Windows connection scan)
        run: flutter test

      - name: Build the app
        run: >-
          flutter build windows --release
          --build-name ${{ env.APP_VERSION }}
          --build-number ${{ github.run_number }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Add the harmless fake virus (for the "Test the alarm" button)
        run: dart compile exe tool/fake_virus.dart -o build/windows/x64/runner/Release/ConnectionFinder-FakeVirus.exe

      - name: Add the Visual C++ runtime so the app runs on any PC
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $dlls = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem $_.FullName -Recurse -Directory -Filter 'Microsoft.VC14*.CRT' -ErrorAction SilentlyContinue } |
            Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|spectre' } |
            Select-Object -First 1
          foreach ($dll in $dlls) {
            if ($crt -and (Test-Path (Join-Path $crt.FullName $dll))) {
              Copy-Item (Join-Path $crt.FullName $dll) $release
            } else {
              Copy-Item "$env:SystemRoot\System32\$dll" $release
            }
          }
          Get-ChildItem $release | Select-Object Name, Length | Format-Table

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyAppNumericVersion=$env:APP_VERSION.0" "windows\installer\connection_finder.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\installer | Select-Object Name, Length | Format-Table

      - name: Keep the installer with this build
        uses: actions/upload-artifact@v4
        with:
          name: ConnectionFinder-Setup
          path: build/installer/ConnectionFinder-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the download (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v$env:APP_VERSION"
          $notes = @"
          **How to install:** download **ConnectionFinder-Setup.exe** below, double-click it and click **Install**.

          If Windows says "Windows protected your PC", click **More info** and then **Run anyway** (the app is new and not signed by a company).
          "@
          gh release create $tag "build/installer/ConnectionFinder-Setup.exe" `
            --repo $repo --target "${{ github.sha }}" `
            --title "Connection Finder $env:APP_VERSION" `
            --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Keep only the 5 newest versions so the Releases page stays tidy.
          $old = gh release list --repo $repo --limit 100 --json tagName,createdAt |
            ConvertFrom-Json | Sort-Object createdAt -Descending | Select-Object -Skip 5
          foreach ($r in $old) {
            gh release delete $r.tagName --repo $repo --cleanup-tag --yes
          }
